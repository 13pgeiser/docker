global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'

    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'nodes'

    static_configs:
      - targets: ['ai350:9100', 'debian00d861dabdae:9100', 'debian00d861c3b883:9100']
        labels:
          group: 'production'

  - job_name: 'power'
    scrape_interval: 5s
    static_configs:
      - targets: ['ai350:10000']
